<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Posts Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Posts Manager</h1>

        <div class="form">

            <input
                type="text"
                id="titleInput"
                placeholder="Post title"
            >

            <textarea
                id="bodyInput"
                placeholder="Post text"
            ></textarea>

            <button id="addPostBtn">
                Add post
            </button>

        </div>


        <h2>Posts</h2>

        <div class="posts"></div>

    </div>


    <script src="script.js"></script>

</body>
</html>
