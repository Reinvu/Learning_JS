<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Interactive status card</h1> 
    <div class="card">
        <p id="text">Text</p>
    </div>
    <div class="boxButton">
        <button id="calm" data-state="calm">Calm</button>
        <button id="attention" data-state="attention">Attention</button>
        <button id="stop" data-state="stop">Stop</button>
    </div>
    <script src="script.js"></script>
    <div>
        <h1>Инструкция: </h1>
        <p>1. Клик по кнопке: смена состояния карточки.</p>
        <p>2. Двойной клик по карточке: сброс к начальному состоянию.</p>
        <p>3. Правый клик по карточке: изменение цвета фона.</p>
        <p>4. Клавиша Escape: сброс к начальному состоянию.</p>
    </div>
</body>
</html>
